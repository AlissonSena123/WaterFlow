<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reporte de Usuário</title>

  <link rel="shortcut icon" href="../../assets/Img/LogoIcon.svg" type="image/x-icon">

  <link rel="stylesheet" type="text/css"
    href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css" />
  <link rel="stylesheet" type="text/css"
    href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css" />

  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="/css/admin/reporte.css">
  <link rel="stylesheet" href="../../css/sidebar.css">
  <link rel="stylesheet" href="../../css/toast.css">


</head>

<body>
  <div class="container">
    <nav id="sidebar">
      <div id="sidebar-content">
        <button class="ph-bold ph-list" id="iconHamburguer"></button>
        <ul id="sidebar-items">
          <li class="sidebar-item">
            <a href="/admin/dashboard">
              <i class="ph-bold ph-gauge"></i>
              <span class="item-title">Painel</span>
            </a>
          </li>
          <li class="sidebar-item">
            <a href="/admin/poligonos">
              <i class="ph-bold ph-map-trifold"></i>
              <span class="item-title">Status</span>
            </a>
          </li>
          <li class="sidebar-item active">
            <a href="/admin/reports">
              <i class="ph-bold ph-warning-circle"></i>
              <span class="item-title">Reporte</span>
            </a>
          </li>
        </ul>
      </div>
      <div id="logout">
        <button id="btn-logout">
          <i class="ph-fill ph-sign-out"></i>
          <span>Sair</span>
        </button>
      </div>
    </nav>

    <div id="sidebar-overlay"></div>
    <span id="toast" class="toast"></span>

    <header>
      <i class="ph-bold ph-list" id="iconHamburguerMobile"></i>
      <img src="../../assets/Img/LogoV1.png" alt="Logo WaterFlow">
    </header>

    <main>
      <section class="status">
        <h1> <i class="ph-fill ph-warning-circle"></i> Reporte dos Usuários</h1>
      </section>
      <section class="filtro">
        <div class="field">
          <label for="userReport">Nome:</label>
          <input type="tel" name="userReport" id="userReport" placeholder="Nome do Usuário">
        </div>

        <div class="field">
          <label for="dataReport">Data:</label>
          <input type="date" name="dataReport" id="dataReport">
        </div>

        <div class="field">
          <label for="regionReport">Região:</label>
          <input type="tel" name="regionReport" id="regionReport" placeholder="Ex: Centro">
        </div>


      </section>

      <section class="reportUserList">
        <h2> <i class="ph-bold ph-list-bullets"></i> Lista de Reporte de Usuários</h2>
        <table>
          <thead>
            <tr>
              <th>Nome:</th>
              <th>Data:</th>
              <th>Região:</th>
              <th>Ação:</th>
            </tr>
          </thead>
          <tbody id="tabelaReports">
            <tr>

            </tr>
          </tbody>
        </table>
      </section>
    </main>

    <div id="modal" class="modal">
      <div class="modal-content">

        <div class="modal-header">
          <div class="modal-header-title">
            <h2 id="mNome"></h2>
            <p id="mEmail"></p>
          </div>
          <button class="ph-fill ph-x-circle" id="iconFecharModal"></button>
        </div>

        <div class="modal-body">
          <div class="modal-body-localidade">
            <p><strong><i class="ph-fill ph-house-line"></i> RUA</strong> <span id="mRua"></span></p>
            <p><strong><i class="ph-fill ph-map-pin"></i> BAIRRO</strong> <span id="mBairro"></span></p>
          </div>
          <p><strong><i class="ph-fill ph-warning-circle"></i> TIPO DO PROBLEMA</strong> <span id="mProblema"></span>
          </p>
          <p><strong><i class="ph-fill ph-sort-ascending"></i> DESCRIÇÃO</strong> <span id="mDescricao"></span></p>
        </div>

        <hr>

        <div id="secaoResposta">
          <p><i class="ph-fill ph-chat-text"></i> Responder usuário</p>

          <select id="selectStatus">
            <option value="recebido" disabled selected>Recebido</option>
            <option value="em_analise">Em análise</option>
            <option value="resolvido">Resolvido</option>
          </select>

          <textarea id="textareaResposta" placeholder="Escreva uma mensagem para o usuário..." rows="3"></textarea>

          <button type="button" id="btnEnviarResposta">
            <i class="ph-fill ph-paper-plane-tilt"></i> Enviar resposta
          </button>
        </div>

        <hr>

        <div class="btnFecharDetalhes">
          <button type="button" id="btnResponder">
            <i class="ph-fill ph-chat-text"></i> Responder
          </button>
          <button type="button" id="btnFecharModal">Fechar</button>
        </div>

      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script type="module" src="/js/logout.js"></script>
  <script type="module" src="/js/admin/reporte.js"></script>
  <script type="module" src="/js/utils/sidebar.js"></script>
</body>

</html>
