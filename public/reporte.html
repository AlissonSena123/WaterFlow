<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"/>
    <link rel="shortcut icon" href="Img/Mask group.png" type="image/x-icon">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/reporta.css">
    <title>Reportar</title>
</head>
<body>
    <header>
        <a href="#"><img src="Img/Logo.png" alt="" width="130px"></a>
    </header>
    <main class="bg-primary">
        <section class="form-report">
            <h2>REPORTAR FALTA D'ÁGUA</h2>
            <form action="">
                <div class="inputGroup item1">
                    <label for="idNome">Nome Completo</label>
                    <input type="text" name="nome_completo" id="idNome" placeholder="Nome Completo" class="input-form" required>
                </div>
                <div class="inputGroup item2">
                    <label for="idRua">Rua</label>
                    <input type="text" name="rua" placeholder="Rua" id="idRua" class="input-form" required>
                </div>
                
                <div class="inputGroup item3">
                    <label for="idCEP">CEP</label>
                    <input type="text" name="CEP" placeholder="CEP" id="idCEP" class="input-form" required>
                </div>
                <div class="inputGroup item4">
                    <label for="idNum">Nº</label>
                    <input type="text" name="numero" placeholder="Nº" id="idNum" class="input-form" required>
                </div>
                <div class="inputGroup item5">
                    <label for="idDesc">Descrição</label>
                    <textarea name="descricao" placeholder="Descreva seu problema aqui:" class="input-form" id="idDesc" required></textarea>
                </div>
                <button type="submit" class="btn-primary">Enviar</button>
            </form>
        </section>
    </main>
    <footer>
        <img src="Img/Logo2.png" alt="LogoTipo-Footer">
        <p>&copy; 2025 WaterFlow — Todos os direitos reservados | Projeto TCC</p>
    </footer>
</body>
</html>
