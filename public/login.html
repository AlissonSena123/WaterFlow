<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="shortcut icon" href="Img/Logo/Mask group.png" type="image/x-icon">
    <link rel="stylesheet" href="Style/global.css">
    <link rel="stylesheet" href="Style/login.css">
</head>
<body>
    <header>
        <img src="Img/Logo.png" alt="LogoTipo">
        <div class="btnGroup">
            <button id="btnEntrar">Entrar</button>
            <button id="btnCadastrar">Cadastrar</button>
        </div>
    </header>
    <main>
        <section class="form-section">
            <div class="form-header">
                <h1>ENTRAR</h1>
                <h3>Bem vindo de volta ao WaterFlow</h3>
            </div>
            <form action="">
                <div class="inputGroup">
                    <div class="inputItem">
                        <label for="idEmail">Email</label>
                        <input type="email" name="email" id="idEmail" required placeholder="@email.com">
                    </div>
                    <div class="inputItem">
                        <label for="idSenha">Senha</label>
                        <input type="password" name="senha" id="idSenha" required placeholder="************">
                    </div>
                </div>
                <button type="submit">ENTRAR</button>
                <p>Primeira vez aqui? <br> <a href="/cadastrar">Cadastra-se aqui</a></p>
            </form>
        </section>
    </main>
    <footer>
        <img src="Img/Logo2.png" alt="" width="150px">
    </footer>
</body>
</html>
