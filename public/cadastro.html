<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="Img/Logo/Mask group.png" type="image/x-icon">
    <link rel="stylesheet" href="Style/global.css">
    <link rel="stylesheet" href="Style/cadastro.css">
    <title>Cadastrar</title>
</head>
<body>
    <header id="cadastro-header">
        <h1>WaterFlow</h1>
    </header>
    <main>
        <div class="cadastro-form-main">
            <h2>Criar uma conta no <br> WaterFlow</h2>
            <form action="">
                <div class="inputGroup">
                    <label for="idNome">Nome Completo</label>
                    <input type="text" name="nome" id="idNome" placeholder="Ex: João Henrique" required>
                </div>
                <div class="inputGroup">
                    <label for="idData">Data de Nascimento</label>
                    <input type="date" name="data_de_nascimento" id="idData" required>
                </div>
                <div class="inputGroup">
                    <label for="idEmail">Email</label>
                    <input type="email" name="email" id="idEmail" placeholder="@email.com" required>
                </div>
                <div class="inputGroup">
                    <label for="idSenha">Senha</label>
                    <input type="password" name="senha" id="idSenha" placeholder="Digite sua senha" min="10" max="15" required>
                    <p class="maxMin">*Digite senhas de 10 a 15 caracteres</p>
                </div>
                <div class="inputGroup">
                    <label for="idTelefone">Telefone</label>
                    <input type="text" name="telefone" id="idTelefone" placeholder="(XX) XXXXX-XXXX">
                </div>
                <div class="inputGroup">
                    <label for="idCEP">CEP</label>
                    <input type="text" name="CEP" id="idCEP" placeholder="Digite seu CEP" required>
                </div>
                <div class="inputGroup">
                    <div class="CEP-inputs">
                        <input type="text" name="" id="" placeholder="Cidade">
                        <input type="text" name="" id="" placeholder="Estado">
                        <input type="text" name="" id="" placeholder="País">
                    </div>
                </div>
                <button type="submit">Cadastrar-se!</button>
            </form>
        </div>
    </main>
    <footer>
        <p>&copy;WaterFlow</p>
    </footer>
</body>
</html>
