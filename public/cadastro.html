<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="Img/Logo/Mask group.png" type="image/x-icon">
    <link rel="stylesheet" href="Style/global.css">
    <link rel="stylesheet" href="Style/cadastro.css">
    <title>Cadastrar</title>
</head>
<body>
    <header>
        <h1>WaterFlow</h1>
    </header>
    <main>
        <div class="cadastro-form">
            <h2>Criar uma conta no <br> WaterFlow</h2>
            <form action="/api/cadastrar" method="post" autocomplete="off">
                <div class="inputGroup item1">
                    <label for="idNome">Nome Completo</label>
                    <input type="text" name="nome_completo" id="idNome" placeholder="Ex: João Henrique" required>
                </div>
                
                <div class="inputGroup item2">
                    <label for="idEmail">Email</label>
                    <input type="email" name="email" id="idEmail" placeholder="@email.com" required>
                </div>
                
                <div class="inputGroup item3">
                    <label for="idSenha">Senha</label>
                    <input type="password" name="senha" id="idSenha" placeholder="Digite sua senha" min="10" max="15" required>
                    <p>*Digite senhas de 10 a 15 caracteres</p>
                </div>
                <div class="inputGroup item4">
                    <label for="idData">Data de Nascimento</label>
                    <input type="date" name="data_nascimento" id="idData" required>
                </div>
                <div class="inputGroup item5">
                    <label for="idTelefone">Telefone</label>
                    <input type="text" name="telefone" id="idTelefone" placeholder="(XX) XXXXX-XXXX">
                </div>
                <div class="inputGroup item6">
                    <label for="idCEP">CEP</label>
                    <input type="text" name="CEP" id="idCEP" placeholder="Digite seu CEP">
                    <p id="errorCEP"></p>
                </div>
                <div class="inputGroup item7">
                    <div class="CEP-inputs">
                        <input type="text" name="cidade" placeholder="Cidade" readonly>
                        <input type="text" name="estado" placeholder="Estado" readonly> 
                        <input type="text" name="pais" placeholder="País" readonly>
                        <input type="text" name="bairro" placeholder="Bairro" readonly>
                    </div>
                </div>
                <button type="submit">Cadastrar-se!</button>
            </form>
            <p>Já possui uma Conta? <br> <a href="/login">Voltar a Tela de Login</a> </p>
        </div>
    </main>
    <footer>
        <p>&copy;WaterFlow</p>
    </footer>
    <script>
        const inputCEP = document.getElementById("idCEP");
        const errorCEP = document.getElementById("errorCEP");

        
        
        inputCEP.addEventListener("blur", async () => {
            const cep = inputCEP.value.replace(/\C/g, "");

            const cidadeInput = document.querySelector("input[name=cidade]");
            const estadoInput = document.querySelector("input[name=estado]");
            const paisInput = document.querySelector("input[name=pais]");
            const bairroInput = document.querySelector("input[name=bairro]");

            if(cep.length !== 8){
                errorCEP.innerHTML = "*Digite um CEP de 8 digitos";
                cidadeInput.value = "";
                estadoInput.value = "";
                paisInput.value = "";
                bairroInput.value = "";
                return;
            }

            const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
            const dados = await response.json();

            if(dados.erro){
                errorCEP.innerHTML = "*CEP não encontrado";
                return;
            }

            errorCEP.innerHTML = "";
            cidadeInput.value = dados.localidade || "";
            estadoInput.value = dados.uf || "";
            paisInput.value = "Brasil";
            bairroInput.value = dados.bairro || "";
        })
    </script>
</body>
</html>
