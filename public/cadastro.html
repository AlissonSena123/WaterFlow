<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="containerCadastro">
        <h1>Cadastro</h1>
        <form action="/imprimir" method="post" class="formulario">
            <input type="text" name="nome" required placeholder="Nome" class="inputCadastro">
            <input type="date" name="data_de_nascimento" required class="inputCadastro">
            <input type="email" name="email" required placeholder="Email" class="inputCadastro">
            <input type="password" name="senha" required placeholder="Senha" class="inputCadastro">
            <select name="bairro" required class="inputCadastro">
                <option value="" selected disabled>Seu Bairro</option>
                <option value="Novo Horizonte">Novo Horizonte</option>
                <option value="Sussuarana">Sussuarana</option>
                <option value="Mata Escura">Mata Escura</option>
                <option value="Boca da Mata">Boca da Mata</option>
                <option value="Stella Maris">Stella Maris</option>
            </select>
            <button type="submit" class="inputCadastro">Continuar</button>
        </form>
    </div>
</body>
</html>
