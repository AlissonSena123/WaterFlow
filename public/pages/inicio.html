<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <link rel="icon" href="/assets/Img/LogoIcon.svg" type="image/svg+xml">

    <link href="https://unpkg.com/maplibre-gl@3.0.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.0.0/dist/maplibre-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

    <link rel="stylesheet" type="text/css"
        href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css" />
    <link rel="stylesheet" type="text/css"
        href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css" />

    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/inicio.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <link rel="stylesheet" href="/css/toast.css">

    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

</head>

<body>
    <div class="container">
        <span id="toast" class="toast"></span>
        <nav id="sidebar">
            <div id="sidebar-content">
                <i class="ph-bold ph-list"></i>
                <ul id="sidebar-items">
                    <li class="sidebar-item active">
                        <a href="/inicio">
                            <i class="ph-bold ph-map-trifold"></i>
                            <span class="item-title">Mapa</span>
                        </a>
                    </li>
                    <li class="sidebar-item">
                        <a href="/reporte">
                            <i class="ph-bold ph-warning-circle"></i>
                            <span class="item-title">Reporte</span>
                        </a>
                    </li>
                    <li class="sidebar-item">
                        <a href="/perfil">
                            <i class="ph-bold ph-user-circle"></i>
                            <span class="item-title">Perfil</span>
                        </a>
                    </li>
                </ul>
            </div>
        </nav>

        <header>
            <i class="ph-bold ph-list" id="iconHamburguer"></i>
            <img src="/assets/Img/LogoV1.png" alt="LogoTipo">
            <div id="notifWrapper">
                <button id="notifBtn" aria-label="Notificações">
                    <i class="ph-bold ph-bell"></i>
                    <span id="notifBadge"></span>
                </button>
                <div id="notifDropdown">
                    <p id="notifTitulo">Notificações</p>
                    <ul id="notifLista"></ul>
                </div>
            </div>
        </header>

        <main>
            <section id="section-map">
                <div class="div-search">
                    <input type="search" id="search" placeholder="Pesquise um bairro" autocomplete="off">

                    <button type="button" id="btnSearch">
                        <span class="ph-bold ph-magnifying-glass"></span>
                    </button>

                    <div id="suggestions"></div>
                </div>
                <div id="map"></div>
                <section id="cardStatus"></section>
            </section>
        </main>

    </div>

    <script src="/js/notificacoes.js"></script>
    <script type="module" src="/js/mapa.js"></script>
    <script type="module" src="/js/utils/sidebar.js"></script>
</body>

</html>
