<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <link rel="shortcut icon" href="../assets/Img/LogoIcon.svg" type="image/x-icon">

    <link href="https://unpkg.com/maplibre-gl@3.0.0/dist/maplibre-gl.css" rel="stylesheet"/>
    <script src="https://unpkg.com/maplibre-gl@3.0.0/dist/maplibre-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css"/>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"/>

    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/inicio.css">
    <link rel="stylesheet" href="../assets/css/sidebar.css">

</head>
<body>
    <div class="container">
        
        <nav id="sidebar">
            <div id="sidebar-content">
                <i class="ph-bold ph-list"></i>
                <ul id="sidebar-items">
                    <li class="sidebar-item active">
                        <a href="/inicio">
                            <i class="ph-bold ph-map-trifold"></i>
                            <span class="item-title">Mapa</span>
                        </a>
                    </li>
                    <li class="sidebar-item">
                        <a href="/forum">
                            <i class="ph-bold ph-chat-text"></i>
                            <span class="item-title">Fórum</span>
                        </a>
                    </li>
                    <li class="sidebar-item">
                        <a href="/reporte">
                            <i class="ph-bold ph-warning-circle"></i>
                            <span class="item-title">Reporte</span>
                        </a>
                    </li>
                    <li class="sidebar-item">
                        <a href="/perfil">
                            <i class="ph-bold ph-user-circle"></i>
                            <span class="item-title">Perfil</span>
                        </a>
                    </li>
                </ul>
            </div>
            <div id="logout">
                <button id="btn-logout">
                    <i class="ph-fill ph-sign-out"></i>
                    <span>Sair</span>
                </button>
            </div>
        </nav>
        <header>
            <img src="../assets/Img/LogoV1.png" alt="LogoTipo">
        </header>
        <main>
            <section id="section-search">
                <form action="" class="barraDePesquisa">
                    <input type="search" name="" id="" placeholder="Pesquisar Bairro">
                    <button type="button" class="ph-bold ph-magnifying-glass"></button>
                </form>
            </section>
            <section id="section-map">
                <div id="map"></div>
            </section>
        </main>
    </div>
    <script src="../assets/JS/mapa.js"></script>
    <script src="../assets/JS/logout.js"></script>
</body>
</html>
