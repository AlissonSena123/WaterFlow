<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <link rel="shortcut icon" href="../Img/Mask group.svg" type="image/x-icon">
    <link href="https://unpkg.com/maplibre-gl@3.0.0/dist/maplibre-gl.css" rel="stylesheet"/>
    <script src="https://unpkg.com/maplibre-gl@3.0.0/dist/maplibre-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"/>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/inicio.css">
</head>
<body>
    <div class="container">
        <nav>
            <div class="btn-nav">
                <button id="btnForum" onclick="window.location.href = '/forum'"><span class="ph-fill ph-chats"></span>Fórum</button>
                <button id="btnReport" onclick="window.location.href = '/reporte'"><span class="ph-fill ph-warning-octagon"></span>Reporte</button>
                <button id="btnPerfil" onclick="window.location.href = '/perfil'"><span class="ph-fill ph-user-circle"></span>Perfil</button>
            </div>
            <button id="btnLogout"><span class="ph-fill ph-sign-out"></span>Sair</button>
        </nav>
        <header>
            <img src="../Img/Logo.png" alt="">
        </header>
        <main id="map"></main>
    </div>
    <script src="../JS/mapa.js"></script>
    <script>
        document.getElementById("btnLogout").addEventListener("click", async () => {
            try 
            {
                const response = await fetch("/logout", {
                    method: "POST",
                    credentials: "include"
                });
                
                const data = await response.json();

                if(!response.ok){
                    return alert(data.error);
                }

                alert(data.message);
                window.location.href = data.redirect;

            } catch (error) {
                console.error(error);
                alert("Erro interno de servidor");
            }
        });
    </script>
</body>
</html>
