<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <link rel="shortcut icon" href="../Img/Mask group.svg" type="image/x-icon">
    <link href="https://unpkg.com/maplibre-gl@3.0.0/dist/maplibre-gl.css" rel="stylesheet"/>
    <script src="https://unpkg.com/maplibre-gl@3.0.0/dist/maplibre-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css"/>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"/>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/inicio.css">
    <link rel="stylesheet" href="../css/sidebar.css">
</head>
<body>
    <div class="container">
        <header>
            <img src="../Img/Logo.png" alt="">
        </header>
        <nav id="sidebar">
            <div id="sidebar-content">
                <ul id="sidebar-items">
                    <li class="sidebar-item active">
                        <a href="/inicio">
                            <i class="ph-bold ph-map-trifold"></i>
                            <span class="item-title">Mapa</span>
                        </a>
                    </li>
                    <li class="sidebar-item">
                        <a href="/forum">
                            <i class="ph-bold ph-chat-text"></i>
                            <span class="item-title">Fórum</span>
                        </a>
                    </li>
                    <li class="sidebar-item">
                        <a href="/reporte">
                            <i class="ph-bold ph-warning-circle"></i>
                            <span class="item-title">Reporte</span>
                        </a>
                    </li>
                    <li class="sidebar-item">
                        <a href="/perfil">
                            <i class="ph-bold ph-user-circle"></i>
                            <span class="item-title">Perfil</span>
                        </a>
                    </li>
                </ul>
                <button id="sidebar-open-btn">
                    <i class="ph-fill ph-caret-circle-double-right"></i>
                </button>
            </div>
            <div id="logout">
                <button id="btn-logout">
                    <i class="ph-fill ph-sign-out"></i>
                    <span>Sair</span>
                </button>
            </div>
        </nav>
        <main id="map"></main>
    </div>
    <script src="../JS/mapa.js"></script>
    <script src="../JS/sidebar.js" defer></script>
    <script>
        document.getElementById("btn-logout").addEventListener("click", async () => {
            try 
            {
                const response = await fetch("/logout", {
                    method: "POST",
                    credentials: "include"
                });
                
                const data = await response.json();

                if(!response.ok){
                    return alert(data.error);
                }

                alert(data.message);
                window.location.href = data.redirect;

            } catch (error) {
                console.error(error);
                alert("Erro interno de servidor");
            }
        });
    </script>
</body>
</html>
