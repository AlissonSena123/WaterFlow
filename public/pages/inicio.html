<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <link rel="icon" href="/assets/Img/LogoIcon.svg" type="image/svg+xml">

    <link href="https://unpkg.com/maplibre-gl@3.0.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.0.0/dist/maplibre-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

    <link rel="stylesheet" type="text/css"
        href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css" />
    <link rel="stylesheet" type="text/css"
        href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css" />

    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/inicio.css">
    <link rel="stylesheet" href="/css/toast.css">

    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

</head>

<body>
    <div class="container">
        <span id="toast" class="toast"></span>
        <header>
            <img src="/assets/Img/LogoV3.png" alt="LogoTipo">
            <div class="navbar">
                <div class="navbar-item active">
                    <a href="/inicio">
                        <i class="ph-bold ph-map-trifold"></i>
                        <span class="item-title">Mapa</span>
                    </a>
                </div>
                <div class="navbar-item">
                    <a href="/reporte">
                        <i class="ph-fill ph-megaphone"></i>
                        <span class="item-title">Reportar falta d'água</span>
                    </a>
                </div>
                <div class="divisor"></div>
                <div id="notifWrapper">
                    <button id="notifBtn" aria-label="Notificações">
                        <i class="ph-bold ph-bell"></i>
                        <span id="notifBadge"></span>
                    </button>
                    <div id="notifDropdown">
                        <p id="notifTitulo">Notificações</p>
                        <ul id="notifLista"></ul>
                    </div>
                </div>
                <div class="perfil" id="perfilWrapper">
                    <i class="ph-bold ph-user-circle iconPerfil"></i>
                    <i class="ph-fill ph-caret-down"></i>
                    <div id="perfilDropdown">
                        <ul>
                            <li>
                                <a href="/perfil">Ver Perfil</a>
                            </li>
                            <li>
                                <a href="/logout" class="perfil-sair" id="perfil-sair"><i
                                        class="ph-fill ph-sign-out"></i>
                                    Sair da conta</a>
                            </li>
                        </ul>
                    </div>
                </div>
                <button id="iconHamburguer" aria-label="Menu" aria-expanded="false">
                    <i class="ph-bold ph-list"></i>
                </button>
            </div>
        </header>
        <nav id="mobileMenu" aria-hidden="true">
            <div>
                <a href="/inicio" class="mobile-item active">
                    <i class="ph-bold ph-map-trifold"></i> 
                    Mapa
                </a>
                <a href="/reporte" class="mobile-item">
                    <i class="ph-fill ph-megaphone"></i> 
                    Reportar falta d'água
                </a>
                <a href="/perfil" class="mobile-item">
                    <i class="ph-fill ph-user"></i>
                    Ver Perfil
                </a>
                <hr>
                <a href="/logout" class="perfil-sair mobile-item" id="perfilMenu-sair"><i class="ph-fill ph-sign-out"></i>
                    Sair da conta</a>
            </div>
        </nav>

        <main>
            <section id="section-map">
                <div class="div-search">
                    <input type="search" id="search" placeholder="Pesquise um bairro" autocomplete="off">

                    <button type="button" id="btnSearch">
                        <span class="ph-bold ph-magnifying-glass"></span>
                    </button>

                    <div id="suggestions"></div>
                </div>
                <div id="map"></div>
                <section id="cardStatus"></section>
            </section>
        </main>

    </div>

    <script src="/js/notificacoes.js"></script>
    <script type="module" src="/js/mapa.js"></script>
    <script type="module" src="/js/logout.js"></script>
    <script type="module" src="/js/header.js"></script>
</body>

</html>
