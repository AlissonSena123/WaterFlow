<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../assets/Img/LogoIcon.svg" type="image/x-icon">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/redefinirSenha.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"/>
    <title>Redefinir Senha</title>
</head>

<body>
    <div class="container">
        <!-- TOAST -->
        <div id="toast">
            <div id="show"></div>
        </div>
        <header> 
            <a href="/redefinir"> <i class="ph-fill ph-arrow-u-up-left"></i> Voltar</a>
        </header>
        <main>
            <section class="sctForgottenPassword">
                <div class="itemForgottenPasswordBHead">
                    <img src="../assets/Img/LogoV1.png" alt="LogoTipo">
                    <i class="ph-fill ph-pen"></i>
                </div>
                <h1>Informe a nova senha</h1>
                <p>Sua identidade foi verificada. Digite e confirme sua nova senha:</p>
                <form id="formAtualizar">
                    <!-- TOKEN HIDDEN (ESSENCIAL!) -->
                    <input type="hidden" id="token">
                    <input type="password" id="novaSenha" placeholder="Nova senha" required>
                    <input type="password" id="confirmarSenha" placeholder="Confirmar nova senha" required>
                    <button type="submit">Atualizar senha</button>
                </form>
            </section>
        </main>
        <script src="../assets/JS/token.js"></script>
    </div>
</body>
</html>
