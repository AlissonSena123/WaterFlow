<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../Img/Mask group.png" type="image/x-icon">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/redefinirSenha.css">
    <title>Redefinir Senha</title>
</head>

<body>
    <div class="container">
        <!-- TOAST -->
        <div id="toast"></div>
        <header>
            <img src="../Img/Logo.png" alt="LogoTipo">
            <nav></nav>
        </header>
        <main>
            <section class="section-redefinirSenha">
                <h1>Informe a nova senha</h1>
                <p>Sua identidade foi verificada. Digite e confirme sua nova senha:</p>
                <form id="formAtualizar">
                    <!-- TOKEN HIDDEN (ESSENCIAL!) -->
                    <input type="hidden" id="token">
                    <input type="password" id="novaSenha" placeholder="Nova senha" required>
                    <input type="password" id="confirmarSenha" placeholder="Confirmar nova senha" required>
                    <button type="submit" class="btn-outline">Atualizar senha</button>
                </form>
            </section>
        </main>
        <script src="../JS/token.js"></script>
        <footer>
            <p>&copy; 2025 WaterFlow. Todos os direitos reservados | Projeto TCC</p>
        </footer>
    </div>
</body>
</html>
