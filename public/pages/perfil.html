<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/assets/Img/LogoIcon.svg" type="image/svg+xml">

    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css"/>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"/>

    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/perfil.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <link rel="stylesheet" href="/css/toast.css">

    <title>Perfil</title>

</head>
<body>
    
    <div class="container">
        <span id="toast" class="toast"></span>
        <nav id="sidebar">
            <div id="sidebar-content">
                <i class="ph-bold ph-list"></i>
                <ul id="sidebar-items">
                    <li class="sidebar-item">
                        <a href="/inicio">
                            <i class="ph-bold ph-map-trifold"></i>
                            <span class="item-title">Mapa</span>
                        </a>
                    </li>
                    <li class="sidebar-item">
                        <a href="/reporte">
                            <i class="ph-bold ph-warning-circle"></i>
                            <span class="item-title">Reporte</span>
                        </a>
                    </li>
                    <li class="sidebar-item active">
                        <a href="/perfil">
                            <i class="ph-bold ph-user-circle"></i>
                            <span class="item-title">Perfil</span>
                        </a>
                    </li>
                </ul>
            </div>
        </nav>

        <header>
            <i class="ph-bold ph-list" id="iconHamburguer"></i>
            <img src="/assets/Img/LogoV1.png" alt="LogoTipo">
        </header>

        <main>
            <section class="titlePerfil">
                <div class="User">
                    <i class="ph-fill ph-user-circle"></i>
                    <h1>Perfil do Usuário <span id="titleNome"></span></h1>
                </div>
                <button type="button" id="btnEditarPerfil"> <i class="ph-fill ph-pen"></i> Editar Perfil</button>
            </section>
            <section id="infoUser">
                <h3>Informações Pessoais:</h3>
                <div class="infoContant">
                    <div class="infoCard">
                        <p>Nome:</p>
                        <p id="userNome"></p>
                    </div>
                    <div class="infoCard">
                        <p>Email:</p>
                        <p id="userEmail"></p>
                    </div>
                    <div class="infoCard">
                        <p>Telefone:</p>
                        <p id="userTel"></p>
                    </div>
                    <div class="infoCard">
                        <p>Data de Nascimento:</p>
                        <p id="userData"></p>
                    </div>
                    <div class="infoCard">
                        <p>Localidade:</p>
                        <p id="userBairro"></p>
                    </div>
                </div>
                <button type="button" id="logout"> <i class="ph-fill ph-sign-out"></i> Sair</button>
            </section>
            <div class="modal" id="modalEdit">
                <aside>
                    <h2> <i class="ph-fill ph-pen"></i> Atualizar Perfil</h2>
                    <form action="" id="form">
                        <div class="atualizarItem">
                            <label for="idNome">Nome:</label>
                            <input type="text" id="idNome" name="nome_completo">
                        </div>
                        <div class="atualizarItem">
                            <label for="idEmail">Email:</label>
                            <input type="email" id="idEmail" name="email">
                        </div>
                        <div class="atualizarItem">
                            <label for="idTel">Telefone:</label>
                            <input type="text" id="idTel" name="telefone">
                        </div>
                        <div class="atualizarItem">
                            <label for="idCEP">CEP:</label>
                            <div>
                                <input type="text" placeholder="Digite o novo CEP" id="idCEP">
                                <input type="text" placeholder="Bairro" id="bairro" name="bairro" readonly>
                            </div>
                        </div>
                        <div id="updateButton">
                            <button type="button" id="btnCancelarEdit"> <i class="ph-fill ph-x-circle"></i> Cancelar</button>
                            <button type="button" id="btnConfirmarAtualizacao"> <i class="ph-fill ph-check-circle"></i> Confirmar Atualização</button>
                        </div>
                    </form>
                </aside>
            </div>
        </main>
    </div>
    
    <script type="module" src="/js/logout.js"></script>
    <script type="module" src="/js/perfil.js"></script>
    <script type="module" src="/js/utils/sidebar.js"></script>
</body>
</html>
