<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../Img/LogoIcon.svg" type="image/x-icon">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"/>
    <title>Entrar</title>
</head>
<body>
    <div class="container">
        <header>
            <img src="../Img/LogoV1.png" alt="LogoTipo">
            <nav>
                <button type="button" class="btn-outline" onclick="window.location.href = '/cadastro'">Cadastrar</button>
            </nav>
        </header>
        <main>
            <section class="section-login">
                <div class="form-header">
                    <h1>ENTRAR</h1>
                    <h3>Bem vindo de volta ao WaterFlow</h3>
                </div>
                <form action="/login" method="post">
                    <div class="form-item-login">
                        <label for="idEmail" class="ph-fill ph-at"></label>
                        <input type="email" name="email" id="idEmail" required placeholder="@email.com" autocomplete="email">
                    </div>
                    <div class="form-item-login">
                        <label for="idSenha" class="ph-fill ph-password"></label>
                        <input type="password" name="senha" id="idSenha" required placeholder="************" autocomplete="current-password">
                    </div>
                    <a href="/redefinir">Esqueceu sua senha?</a>
                    <button type="submit" class="btn-primary"><span class="ph-fill ph-sign-in"></span>Entrar</button>
                </form>
                <p>Primeira vez aqui? <a href="/cadastro">Cadastra-se</a></p>
            </section>
        </main>
    </div>
    <script src="../js/redirecionar.js"></script>
</body>
</html>
