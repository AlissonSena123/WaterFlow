<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../assets/Img/LogoIcon.svg" type="image/x-icon">
    
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/login.css">
    <link rel="stylesheet" href="../assets/css/toast.css">

    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"/>
    <title>Entrar</title>
</head>
<body>
    <div class="container">
        <span id="toast" class="toast"></span>
        <header>
            <img src="../assets/Img/LogoV1.png" alt="LogoTipo">
        </header>
        <main>
            <section class="section-login">
                <div class="section-login-header">
                    <h1>ENTRAR</h1>
                    <h3>Bem vindo de volta ao WaterFlow</h3>
                </div>
                <form>
                    <div class="form-item-login">
                        <label for="idEmail" class="ph-fill ph-at"></label>
                        <input type="email" name="email" id="idEmail" placeholder="Digite seu email" autocomplete="email">
                    </div>
                    <div class="form-item-login">
                        <label for="idSenha" class="ph-fill ph-password"></label>
                        <input type="password" name="senha" id="idSenha" placeholder="Digite sua senha" autocomplete="current-password" minlength="10" maxlength="15" autocomplete="off">
                        <span class="toggle-senha" id="toggleMostrarSenha">
                            <i class="ph-fill ph-eye" id="iconToggle"></i>
                        </span>
                    </div>
                    <a href="/redefinir">Esqueceu sua senha?</a>
                    <button type="submit" id="btnLogin"><span class="ph-fill ph-sign-in"></span>Entrar</button>
                </form>
                <p>Primeira vez aqui? <a href="/cadastro">Cadastra-se</a></p>
            </section>
        </main>
    </div>
    <script type="module" src="../assets/js/login.js"></script>
</body>
</html>
