<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Usuário</title>

    <link rel="shortcut icon" href="../../assets/Img/LogoIcon.svg" type="image/x-icon">

    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css"/>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"/>
    
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/reporteAdmin.css">
    <link rel="stylesheet" href="../../assets/css/sidebar.css">

</head>
<body>
    <div class="container">

        <header>
            <img src="../../assets/Img/LogoV1.png" alt="Logo WaterFlow">
        </header>

        <nav id="sidebar">
          <div id="sidebar-content">
            <i class="ph-bold ph-list"></i>
            <ul id="sidebar-items">
              <li class="sidebar-item">
                <a href="/funcionario/dashboard">
                  <i class="ph-bold ph-gauge"></i>
                  <span class="item-title">Painel</span>
                </a>
              </li>
              <li class="sidebar-item">
                <a href="/funcionario/poligonos">
                  <i class="ph-bold ph-map-trifold"></i>
                  <span class="item-title">Polígonos</span>
                </a>
              </li>
              <li class="sidebar-item">
                <a href="/funcionario/relatorios">
                  <i class="ph-bold ph-file-text"></i>
                  <span class="item-title">Relatórios</span>
                </a>
              </li>
              <li class="sidebar-item">
                <a href="/funcionario/usuarios">
                  <i class="ph-bold ph-users"></i>
                  <span class="item-title">Usuários</span>
                </a>
              </li>
              <li class="sidebar-item active">
                <a href="/funcionario/usuarios">
                  <i class="ph-bold ph-warning-circle"></i>
                  <span class="item-title">Reporte</span>
                </a>
              </li>
            </ul>
          </div>
          <div id="logout">
            <button id="btn-logout">
              <i class="ph-fill ph-sign-out"></i>
              <span>Sair</span>
            </button>
          </div>
        </nav>

        <main>
            <section class="status">
                <div>
                    <h1> <i class="ph-fill ph-warning-circle"></i> Reporte dos Usuários</h1>
                    <p>Status: <strong>Pronto para gerar</strong> � Última atualizacao: 12:40</p>
                </div>
            </section>
        </main>

    </div>
</body>
</html>
