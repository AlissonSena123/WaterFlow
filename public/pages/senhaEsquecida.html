<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../assets/Img/LogoIcon.svg" type="image/x-icon">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/senhaEsquecida.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"/>
    <title>Redefinir Senha</title>
</head>
<body>
    <div class="container">
        <header>
            <div class="back-icon">
                <i class="ph-fill ph-arrow-bend-up-left"></i>
                <a href="/login">Voltar</a>
            </div>
            <img src="../assets/Img/LogoV1.png" alt="LogoTipo">
        </header>
        <main>
            <section class="section-esqueciSenha">
                <h1>Redefinir Senha</h1>
                <p>Digite seu E-mail abaixo para poder realizar a redefinição da sua senha.</p>
                <form action="/redefinirSenha" method="post">
                    <input type="email" name="email" placeholder="Digite seu Email" required>
                    <button class="btn-primary" type="submit">Enviar</button>
                </form>
            </section>
            <section class="image-wrapper">
                <img src="../assets/Img/undraw_email-consent_j36b.svg" alt="">
            </section>
        </main>
        <footer>
            <p>&copy; 2025 WaterFlow. Todos os direitos reservados | Projeto TCC</p>
        </footer>
    </div>
</body>
</html>
