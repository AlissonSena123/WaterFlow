<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../Img/Mask group.png" type="image/x-icon">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/senhaEsquecida.css">
    <title>Redefinir Senha</title>
</head>
<body>
    <header class="header-primary-d_flex-space_between">
        <img src="../Img/Logo.png" alt="LogoTipo">
    </header>
    <main class="main-primary bg-primary-linear">
        <section class="section-esqueciSenha">
            <h1>Redefinir Senha</h1>
            <p>Digite seu E-mail abaixo para poder realizar a redefinição da sua senha.</p>
            <form action="/redefinirSenha" method="post">
                <input type="email" name="email" id="email" placeholder="Digite seu Email" class="input-form" required>
                <button class="btn-outline" type="submit">Enviar</button>
            </form>
        </section>
        <section class="section-esqueciSenha-img">
            <img src="../Img/12085707_20944201.svg" alt="ilustração-redefinir" style="padding: 20px;">
        </section>
    </main>
    <footer>
        <img src="../Img/Logo2.png" alt="">
        <p>&copy; 2025 WaterFlow. Todos os direitos reservados | Projeto TCC</p>
    </footer>
</body>
</html>
