<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../Img/Mask group.svg" type="image/x-icon">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/reporta.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"/>
    <title>Reportar</title>
</head>
<body class="bg-primary-img">
    <header>
        <a href="/inicio" class="ph-fill ph-house-line"></a>
        <img src="../Img/Logo.png" alt="">
    </header>
    <main>
        <h2>Reportar falta d'água</h2>
        <p>Preencha os campos com os dados correspondentes:</p>
        <section>
            <form action="">
                <div id="item1">
                    <label for="idNome">Nome</label>
                    <input type="text" name="nome" id="idNome">  
                </div>
                <div id="item2">
                    <label for="">Email</label>
                    <input type="text" name="email" id="idEmail">
                </div>
                <div id="item3">
                    <label for="idCep">Cep</label>
                    <input type="text" name="cep" id="idCep">
                </div>
                <div id="item4">
                    <input type="text" name="rua" id="idRua" placeholder="Rua" disabled>
                </div>
                <div id="item5">
                    <input type="text" name="bairro" id="idBairro" placeholder="Bairro" disabled>
                </div>
                <div id="item6">
                    <label for="idDescricao">Descrição</label>
                    <textarea name="descricao" id="idDescricao"></textarea>
                </div>
                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>
</body>
</html>
