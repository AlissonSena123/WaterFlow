<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../Img/Mask group.svg" type="image/x-icon">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/reporta.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css"/>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"/>
    <title>Reportar</title>
</head>
<body class="bg-primary-img">
    <div class="container">
        <nav class="sidebar">
            <div class="btn-expandir">
                <i class="ph-bold ph-list"></i>
            </div>
            <ul>
                <li class="sideBar-item">
                    <a href="/inicio">
                        <span class="icon"><i class="ph-fill ph-map-pin"></i></span>
                        <span class="title">Mapa</span>
                    </a>
                </li>
                <li class="sideBar-item">
                    <a href="/forum">
                        <span class="icon"><i class="ph-fill ph-chat-text"></i></span>
                        <span class="title">Fórum</span>
                    </a>
                </li>
                <li class="sideBar-item active">
                    <a href="/reporte">
                        <span class="icon"><i class="ph-fill ph-warning-circle"></i></span>
                        <span class="title">Reporte</span>
                    </a>
                </li>
                <li class="sideBar-item">
                    <a href="/perfil">
                        <span class="icon"><i class="ph-fill ph-user-circle"></i></span>
                        <span class="title">Perfil</span>
                    </a>
                </li>
            </ul>
        </nav>
        <main>
            <div class="title-report">
                <i class="ph-fill ph-warning-circle"></i>
                <h2>Reportar falta d'água</h2>
            </div>
            <p>Preencha os campos com os dados correspondentes:</p>
            <hr>
            <section>
                <form action="" autocomplete="off">
                    <div id="item1">
                        <label for="idNome">Nome</label>
                        <input type="text" name="nome" id="idNome" required placeholder="Digite seu nome">
                    </div>
                    <div id="item2">
                        <label for="idEmail">Email</label>
                        <input type="text" name="email" id="idEmail" required placeholder="Digite seu email">
                    </div>
                    <div id="item3">
                        <label for="idCEP">CEP</label>
                        <input type="text" name="cep" id="idCEP" required placeholder="Digite seu CEP">
                    </div>
                    <div id="item4">
                        <input type="text" name="rua" id="idRua" placeholder="Rua" readonly>
                    </div>
                    <div id="item5">
                        <input type="text" name="bairro" id="idBairro" placeholder="Bairro" readonly>
                    </div>
                    <div id="item6">
                        <label for="idDescricao">Descrição</label>
                        <textarea name="descricao" id="idDescricao" placeholder="Descreva o seu problema nesse campo"></textarea>
                    </div>
                    <button type="submit">Enviar</button>
                </form>
            </section>
        </main>
    </div>
    <script src="../JS/sidebar.js" defer></script>
</body>
</html>
