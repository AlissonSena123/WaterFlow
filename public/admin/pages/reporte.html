<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Usuário</title>

    <link rel="shortcut icon" href="../../assets/Img/LogoIcon.svg" type="image/x-icon">

    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css"/>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"/>
    
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/sidebar.css">
    <link rel="stylesheet" href="../css/reporte.css">
    
</head>
<body>
    <div class="container">

        <header>
            <img src="../../assets/Img/LogoV1.png" alt="Logo WaterFlow">
        </header>

        <nav id="sidebar">
          <div id="sidebar-content">
            <i class="ph-bold ph-list"></i>
            <ul id="sidebar-items">
              <li class="sidebar-item">
                <a href="/funcionario/dashboard">
                  <i class="ph-bold ph-gauge"></i>
                  <span class="item-title">Painel</span>
                </a>
              </li>
              <li class="sidebar-item">
                <a href="/funcionario/poligonos">
                  <i class="ph-bold ph-map-trifold"></i>
                  <span class="item-title">Polígonos</span>
                </a>
              </li>
              <li class="sidebar-item">
                <a href="/funcionario/relatorios">
                  <i class="ph-bold ph-file-text"></i>
                  <span class="item-title">Relatórios</span>
                </a>
              </li>
              <li class="sidebar-item">
                <a href="/funcionario/usuarios">
                  <i class="ph-bold ph-users"></i>
                  <span class="item-title">Usuários</span>
                </a>
              </li>
              <li class="sidebar-item active">
                <a href="/funcionario/usuarios">
                  <i class="ph-bold ph-warning-circle"></i>
                  <span class="item-title">Reporte</span>
                </a>
              </li>
            </ul>
          </div>
          <div id="logout">
            <button id="btn-logout">
              <i class="ph-fill ph-sign-out"></i>
              <span>Sair</span>
            </button>
          </div>
        </nav>

        <main>
            <section class="status">
                <div>
                    <h1> <i class="ph-fill ph-warning-circle"></i> Reporte dos Usuários</h1>
                    <p>Status: <strong>Pronto para gerar</strong> � Última atualizacao: 12:40</p>
                </div>
            </section>
            <section class="filtro">

              <div class="field">
                <label for="userReport">Nome:</label>
                <input type="tel" name="userReport" id="userReport" placeholder="Nome do Usuário">
              </div>

              <div class="field">
                <label for="dataReport">Data:</label>
                <input type="date" name="dataReport" id="dataReport">
              </div>

              <div class="field">
                <label for="regionReport">Região:</label>
                <input type="tel" name="regionReport" id="regionReport" placeholder="Ex: Centro">
              </div>

              <button type="button"> <i class="ph-fill ph-file-magnifying-glass"></i> Filtrar</button>

            </section>

            <section class="reportUserList">
              <table>
                <thead>
                  <tr>
                    <th>Nome:</th>
                    <th>Data:</th>
                    <th>Região:</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>

                  </tr>
                </tbody>
              </table>
            </section>

        </main>

    </div>
    <script type="module" src="../../js/logout.js"></script>
    <script src="../js/reporte.js"></script>
</body>
</html>
